<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Orbit Hop — a tiny one-button arcade game. Switch orbits, grab stars, dodge blocks.">
<title>Orbit Hop</title>
<style>
  html, body { margin: 0; height: 100%; background: #07061a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; cursor: pointer; }
  .home { position: fixed; left: 12px; bottom: 12px; padding: 8px 14px; border-radius: 999px; font: 600 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #eef0ff; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); text-decoration: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .home:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="home" href="../">← All games</a>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const TAU = Math.PI * 2;
const FONT = 'system-ui, -apple-system, Segoe UI, Roboto, sans-serif';

// ---------- Layout ----------
let W, H, cx, cy, R = [0, 0], U = 1, bg = [];
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  c.width = W * d; c.height = H * d;
  c.style.width = W + 'px'; c.style.height = H + 'px';
  g.setTransform(d, 0, 0, d, 0, 0);
  cx = W / 2; cy = H / 2;
  const m = Math.min(W, H);
  R = [m * 0.2, m * 0.34];
  U = Math.max(0.8, Math.min(1.4, m / 600));
  bg = [];
  for (let i = 0; i < 90; i++) bg.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + 0.3, p: Math.random() * TAU });
}
addEventListener('resize', resize);
resize();

// ---------- Storage & sound ----------
let best = 0;
try { best = +localStorage.getItem('orbitHopBest') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('orbitHopBest', best); } catch (e) {} }

let ac = null, muted = false;
function beep(f, d, type = 'sine', v = 0.08, slide = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    gn.gain.setValueAtTime(v, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn).connect(ac.destination);
    o.start(t); o.stop(t + d);
  } catch (e) {}
}

// ---------- Helpers ----------
function ad(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function pos(a, r) { return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }

// ---------- Game state ----------
let state = 'menu', p, obs = [], star = null, parts = [], trail = [];
let score = 0, spawnT = 0, speed = 1.5, deadT = 0, flash = 0, shake = 0, time = 0, newBest = false;

function reset() {
  p = { a: -Math.PI / 2, ring: 1, r: R[1] };
  obs = []; parts = []; trail = [];
  score = 0; spawnT = 1.5; speed = 1.5; newBest = false;
  placeStar();
}
function ahead(min, max) { return p.a + min + Math.random() * (max - min); }

function placeStar() {
  for (let i = 0; i < 20; i++) {
    const ring = Math.random() < 0.5 ? 0 : 1, a = ahead(1.4, 4.6);
    if (!obs.some(o => o.ring === ring && Math.abs(ad(a, o.a)) < 0.4)) { star = { a, ring, t: 0 }; return; }
  }
  star = { a: ahead(1.4, 4.6), ring: p.ring, t: 0 };
}

function spawnObs() {
  const gap = 0.25 + speed * 0.35; // keeps a passable gap between rings
  for (let i = 0; i < 10; i++) {
    const ring = Math.random() < 0.5 ? 0 : 1, a = ahead(1.3, 3.8);
    const bad = obs.some(o => { const d = Math.abs(ad(a, o.a)); return o.ring === ring ? d < 0.3 : d < gap; })
      || (star && star.ring === ring && Math.abs(ad(a, star.a)) < 0.4);
    if (!bad) { obs.push({ a, ring, t: 0, life: 5.5 + Math.random() * 2, rot: Math.random() * TAU }); return; }
  }
}

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = (40 + Math.random() * 160) * U, life = 0.4 + Math.random() * 0.5;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, col });
  }
}

function die(x, y) {
  state = 'over'; deadT = 0; shake = 12;
  burst(x, y, '#ff4d6d', 40); burst(x, y, '#ffffff', 12);
  beep(220, 0.5, 'sawtooth', 0.08, 60);
  if (score > best) { best = score; saveBest(); newBest = true; }
}

function start() { reset(); state = 'play'; beep(440, 0.1, 'triangle', 0.06, 660); }

function act() {
  if (state === 'menu') return start();
  if (state === 'over') { if (deadT > 0.5) start(); return; }
  p.ring ^= 1;
  beep(p.ring ? 520 : 390, 0.06, 'sine', 0.05);
}

c.addEventListener('pointerdown', e => { e.preventDefault(); act(); });
addEventListener('keydown', e => {
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (e.code === 'Escape') { location.href = '../'; return; }
  if (['Space', 'ArrowUp', 'ArrowDown', 'Enter', 'KeyW', 'KeyS'].includes(e.code)) {
    e.preventDefault();
    if (!e.repeat) act();
  }
});

// ---------- Update ----------
function update(dt) {
  time += dt;
  for (const s of parts) { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.96; s.vy *= 0.96; s.life -= dt; }
  parts = parts.filter(s => s.life > 0);
  flash = Math.max(0, flash - dt * 3);
  shake = Math.max(0, shake - dt * 30);
  if (state !== 'play') { if (state === 'over') deadT += dt; return; }

  p.a += speed * dt;
  p.r += (R[p.ring] - p.r) * Math.min(1, dt * 16);
  const [px, py] = pos(p.a, p.r);
  trail.push([px, py]); if (trail.length > 14) trail.shift();

  spawnT -= dt;
  if (spawnT <= 0) { spawnObs(); spawnT = Math.max(0.5, 1.4 - score * 0.035); }

  const pr = 8 * U;
  for (const o of obs) {
    o.t += dt; o.rot += dt * 2;
    const grown = Math.min(1, o.t / 0.35), fade = Math.min(1, (o.life - o.t) / 0.4);
    if (grown < 1 || fade < 0.5) continue;
    const [ox, oy] = pos(o.a, R[o.ring]);
    if (Math.hypot(ox - px, oy - py) < pr + 9 * U) { die(px, py); return; }
  }
  obs = obs.filter(o => o.t < o.life);

  if (star) {
    star.t += dt;
    const [sx, sy] = pos(star.a, R[star.ring]);
    if (Math.hypot(sx - px, sy - py) < pr + 12 * U) {
      score++;
      burst(sx, sy, '#ffd166', 14);
      beep(660 + score * 10, 0.12, 'triangle', 0.07, 990 + score * 10);
      flash = 0.3;
      speed = Math.min(3.2, 1.5 + score * 0.06);
      placeStar();
    }
  }
}

// ---------- Draw ----------
function drawStar(x, y, r, rot) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.shadowColor = '#ffd166'; g.shadowBlur = 16; g.fillStyle = '#ffd166';
  g.beginPath();
  for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * 0.4 : r, a = i * Math.PI / 4; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  g.closePath(); g.fill(); g.restore();
}

function drawPlayer(x, y) {
  g.save(); g.shadowColor = '#77ccff'; g.shadowBlur = 20; g.fillStyle = '#e8f7ff';
  g.beginPath(); g.arc(x, y, 8 * U, 0, TAU); g.fill(); g.restore();
}

function text(str, x, y, size, color, weight = 700) {
  g.font = `${weight} ${Math.round(size)}px ${FONT}`;
  g.fillStyle = color; g.fillText(str, x, y);
}

function draw() {
  g.save();
  if (shake > 0) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  const grd = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  grd.addColorStop(0, '#1d1740'); grd.addColorStop(1, '#07061a');
  g.fillStyle = grd; g.fillRect(-20, -20, W + 40, H + 40);

  g.fillStyle = '#cfd3ff';
  for (const s of bg) { g.globalAlpha = 0.4 + 0.4 * Math.sin(time * 2 + s.p); g.fillRect(s.x, s.y, s.s, s.s); }
  g.globalAlpha = 1;

  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (state !== 'menu') text(score, cx, cy + 4, R[0] * 0.9, 'rgba(255,255,255,0.1)', 800);

  for (let i = 0; i < 2; i++) {
    g.beginPath(); g.arc(cx, cy, R[i], 0, TAU);
    g.strokeStyle = state === 'play' && p.ring === i ? 'rgba(140,160,255,0.55)' : 'rgba(140,160,255,0.2)';
    g.lineWidth = 2 * U; g.stroke();
  }

  if (star && state !== 'menu') {
    const [sx, sy] = pos(star.a, R[star.ring]);
    const sc = Math.min(1, star.t / 0.3) * (1 + 0.12 * Math.sin(time * 6));
    drawStar(sx, sy, 11 * U * sc, time * 1.5);
  }

  for (const o of obs) {
    const [ox, oy] = pos(o.a, R[o.ring]);
    const grown = Math.min(1, o.t / 0.35), fade = Math.max(0, Math.min(1, (o.life - o.t) / 0.4));
    const s = 9 * U * grown;
    g.save(); g.globalAlpha = fade; g.translate(ox, oy); g.rotate(o.rot);
    g.shadowColor = '#ff4d6d'; g.shadowBlur = 14; g.fillStyle = '#ff4d6d';
    g.fillRect(-s, -s, 2 * s, 2 * s); g.restore();
  }

  if (state === 'play') {
    for (let i = 0; i < trail.length; i++) {
      const k = i / trail.length;
      g.globalAlpha = k * 0.5; g.fillStyle = '#77ccff';
      g.beginPath(); g.arc(trail[i][0], trail[i][1], 8 * U * k, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
    const [px, py] = pos(p.a, p.r);
    drawPlayer(px, py);
  } else if (state === 'menu') {
    const ring = Math.floor(time / 1.2) % 2;
    const [dx, dy] = pos(time * 1.2, R[ring]);
    drawPlayer(dx, dy);
  }

  for (const s of parts) {
    g.globalAlpha = Math.max(0, s.life / s.max); g.fillStyle = s.col;
    g.fillRect(s.x - 2 * U, s.y - 2 * U, 4 * U, 4 * U);
  }
  g.globalAlpha = 1;

  if (flash > 0) { g.fillStyle = `rgba(255,209,102,${flash * 0.15})`; g.fillRect(-20, -20, W + 40, H + 40); }
  g.restore();

  // UI
  const topY = Math.max(44 * U, (cy - R[1]) / 2);
  const botY = H - Math.max(44 * U, (H - cy - R[1]) / 2);
  g.textAlign = 'center'; g.textBaseline = 'middle';

  if (state === 'menu') {
    text('ORBIT HOP', cx, topY - 10 * U, 44 * U, '#e8f7ff', 800);
    text('Collect ✦  ·  Avoid ■', cx, topY + 28 * U, 16 * U, 'rgba(232,247,255,0.65)', 500);
    const pulse = 0.6 + 0.4 * Math.sin(time * 4);
    text('Tap or press Space to switch orbits', cx, botY - 12 * U, 16 * U, `rgba(232,247,255,${pulse})`, 600);
    if (best) text('Best: ' + best, cx, botY + 16 * U, 14 * U, 'rgba(255,209,102,0.8)', 600);
  } else if (state === 'over' && deadT > 0.3) {
    text('Game over', cx, topY - 10 * U, 36 * U, '#ff8fa3', 800);
    text(newBest ? '★ New best: ' + best : 'Score ' + score + '  ·  Best ' + best, cx, topY + 26 * U, 17 * U, '#ffd166', 600);
    if (deadT > 0.5) {
      const pulse = 0.6 + 0.4 * Math.sin(time * 4);
      text('Tap or press Space to play again', cx, botY, 16 * U, `rgba(232,247,255,${pulse})`, 600);
    }
  } else if (state === 'play') {
    g.textAlign = 'left';
    text('Best ' + best, 16, 22, 13 * U, 'rgba(232,247,255,0.5)', 600);
  }
  if (muted) { g.textAlign = 'right'; text('muted (M)', W - 16, 22, 13 * U, 'rgba(232,247,255,0.5)', 600); }
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
