<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Neon Dash — an endless runner. Jump, double-jump, grab coins, don't crash.">
<meta name="theme-color" content="#12052b">
<title>Neon Dash</title>
<style>
  html, body { margin: 0; height: 100%; background: #12052b; overflow: hidden; touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  canvas { display: block; cursor: pointer; }
  .home { position: fixed; left: 12px; bottom: 12px; padding: 8px 14px; border-radius: 999px; font: 600 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #f3eaff; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); text-decoration: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .home:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="home" href="../">← All games</a>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const FONT = 'system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
const TAP = matchMedia('(pointer: coarse)').matches ? 'Tap' : 'Tap or press Space';

// ---------- Layout ----------
let W, H, U, groundY, hills = [];
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  c.width = W * d; c.height = H * d;
  c.style.width = W + 'px'; c.style.height = H + 'px';
  g.setTransform(d, 0, 0, d, 0, 0);
  U = Math.max(0.75, Math.min(1.4, Math.min(W, H) / 600));
  groundY = H * 0.72;
  hills = [];
  for (let i = 0; i < 12; i++) hills.push({ x: i / 12, h: 0.3 + Math.random() * 0.7 });
}
addEventListener('resize', resize);
resize();

// ---------- Storage & sound ----------
let best = 0;
try { best = +localStorage.getItem('neonDashBest') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('neonDashBest', best); } catch (e) {} }

let ac = null, muted = false;
function beep(f, d, type = 'sine', v = 0.08, slide = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    gn.gain.setValueAtTime(v, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn).connect(ac.destination);
    o.start(t); o.stop(t + d);
  } catch (e) {}
}

// ---------- Game state ----------
const GRAV = 2600, JUMP = 820, CUT = 320;
let state = 'menu', pl, obs = [], coins = [], parts = [], trail = [];
let dist = 0, coinCount = 0, speed = 0, nextGap = 0, time = 0, deadT = 0, shake = 0, newBest = false, scroll = 0;

function score() { return Math.floor(dist / (40 * U)) + coinCount * 5; }

function reset() {
  pl = { y: 0, vy: 0, jumps: 0, rot: 0, onGround: true };
  obs = []; coins = []; parts = []; trail = [];
  dist = 0; coinCount = 0; speed = 330 * U; nextGap = W * 0.6; newBest = false;
}
reset();

function size() { return 28 * U; }
function px() { return Math.max(60 * U, W * 0.2); }

function spawn() {
  const air = 2 * JUMP / GRAV; // seconds in the air on one jump
  const type = Math.random();
  const x = W + 40 * U;
  let w = (22 + Math.random() * 30) * U, h = (28 + Math.random() * 46) * U;
  if (type < 0.2 && speed > 380 * U) {
    // a double block: needs a well-timed or double jump
    obs.push({ x, w, h });
    obs.push({ x: x + w + (16 + Math.random() * 20) * U, w: 22 * U, h: h * 0.7 });
  } else if (type < 0.35) {
    // floating bar: duck under by staying low, or jump over high
    obs.push({ x, w: (60 + Math.random() * 40) * U, h: 18 * U, lift: (70 + Math.random() * 20) * U });
  } else {
    obs.push({ x, w, h });
  }
  // coins arc over the obstacle
  if (Math.random() < 0.6) {
    const n = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      coins.push({ x: x - 50 * U + t * 140 * U, y: -(60 + Math.sin(t * Math.PI) * 80) * U, got: false });
    }
  }
  nextGap = speed * air * (1.15 + Math.random() * 1.1) + 60 * U;
}

function start() { reset(); state = 'play'; beep(330, 0.1, 'triangle', 0.06, 660); }

function jump() {
  if (pl.jumps >= 2) return;
  pl.vy = -JUMP * U * (pl.jumps ? 0.85 : 1);
  pl.jumps++; pl.onGround = false;
  beep(pl.jumps === 1 ? 440 : 620, 0.08, 'square', 0.035, pl.jumps === 1 ? 660 : 880);
  for (let i = 0; i < 6; i++) parts.push({ x: px() + size() / 2, y: groundY + pl.y, vx: (Math.random() - 0.5) * 120 * U, vy: Math.random() * 60 * U, life: 0.35, max: 0.35, col: '#7af7ff' });
}

function release() { if (state === 'play' && pl.vy < -CUT * U) pl.vy = -CUT * U; }

function act() {
  if (state === 'menu') return start();
  if (state === 'over') { if (deadT > 0.6) start(); return; }
  jump();
}

function die() {
  state = 'over'; deadT = 0; shake = 14;
  const x = px() + size() / 2, y = groundY + pl.y - size() / 2;
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2, s = (80 + Math.random() * 260) * U;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.8, max: 0.8, col: i % 3 ? '#ff4fb4' : '#7af7ff' });
  }
  beep(200, 0.6, 'sawtooth', 0.08, 50);
  const s = score();
  if (s > best) { best = s; saveBest(); newBest = true; }
}

c.addEventListener('pointerdown', e => { e.preventDefault(); act(); });
addEventListener('pointerup', release);
addEventListener('keydown', e => {
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (e.code === 'Escape') { location.href = '../'; return; }
  if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
    e.preventDefault();
    if (!e.repeat) act();
  }
});
addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) release(); });

// ---------- Update ----------
function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 30);
  for (const p of parts) { p.vy += 900 * U * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);

  if (state === 'over') { deadT += dt; return; }
  const move = (state === 'play' ? speed : 200 * U) * dt;
  scroll += move;
  if (state !== 'play') return;

  dist += move;
  speed = Math.min(720 * U, speed + 9 * U * dt);

  // player physics
  pl.vy += GRAV * U * dt;
  pl.y += pl.vy * dt;
  if (pl.y >= 0) {
    if (!pl.onGround) { pl.rot = Math.round(pl.rot / (Math.PI / 2)) * (Math.PI / 2); }
    pl.y = 0; pl.vy = 0; pl.jumps = 0; pl.onGround = true;
  } else {
    pl.rot += dt * 7;
  }
  trail.push({ x: px() + size() / 2, y: groundY + pl.y - size() / 2 });
  if (trail.length > 10) trail.shift();
  for (const t of trail) t.x -= move;

  // world
  nextGap -= move;
  if (nextGap <= 0) spawn();
  for (const o of obs) o.x -= move;
  for (const k of coins) k.x -= move;
  obs = obs.filter(o => o.x + o.w > -50);
  coins = coins.filter(k => k.x > -50 && !k.got);

  // collisions (a little forgiving)
  const s = size(), m = 5 * U;
  const L = px() + m, R = px() + s - m, T = groundY + pl.y - s + m, B = groundY + pl.y - m;
  for (const o of obs) {
    const oT = groundY - (o.lift || 0) - o.h, oB = groundY - (o.lift || 0);
    if (R > o.x && L < o.x + o.w && B > oT && T < oB) { die(); return; }
  }
  for (const k of coins) {
    const kx = k.x, ky = groundY + k.y;
    if (Math.abs(kx - (L + R) / 2) < s * 0.7 && Math.abs(ky - (T + B) / 2) < s * 0.7) {
      k.got = true; coinCount++;
      beep(988, 0.1, 'triangle', 0.06, 1318);
      for (let i = 0; i < 8; i++) parts.push({ x: kx, y: ky, vx: (Math.random() - 0.5) * 200 * U, vy: (Math.random() - 0.8) * 200 * U, life: 0.4, max: 0.4, col: '#ffe066' });
    }
  }
}

// ---------- Draw ----------
function text(str, x, y, sz, color, weight = 700) {
  g.font = `${weight} ${Math.round(Math.max(12, sz))}px ${FONT}`;
  g.fillStyle = color; g.fillText(str, x, y);
}

function draw() {
  // sky
  const sky = g.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, '#12052b'); sky.addColorStop(1, '#4a0f5c');
  g.fillStyle = sky; g.fillRect(0, 0, W, groundY);

  // sun with stripes
  const sunR = Math.min(W, H) * 0.18, sx = W * 0.7, sy = groundY - sunR * 0.35;
  const sun = g.createLinearGradient(0, sy - sunR, 0, sy + sunR);
  sun.addColorStop(0, '#ffd36e'); sun.addColorStop(1, '#ff3d8b');
  g.save();
  g.beginPath(); g.arc(sx, sy, sunR, 0, Math.PI * 2); g.clip();
  g.fillStyle = sun; g.fillRect(sx - sunR, sy - sunR, sunR * 2, sunR * 2);
  g.fillStyle = '#3a0c50';
  for (let i = 0; i < 6; i++) { const yy = sy + i * sunR * 0.17; g.fillRect(sx - sunR, yy, sunR * 2, 2 + i * 1.6); }
  g.restore();

  // parallax hills
  g.fillStyle = '#250a3d';
  g.beginPath(); g.moveTo(0, groundY);
  const off = (scroll * 0.15) % W;
  for (let rep = 0; rep < 2; rep++) {
    for (const h of hills) {
      const x = h.x * W + rep * W - off;
      g.lineTo(x, groundY - h.h * H * 0.14);
      g.lineTo(x + W / 24, groundY);
    }
  }
  g.lineTo(W, groundY); g.closePath(); g.fill();

  g.save();
  if (shake > 0) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // ground grid
  g.fillStyle = '#12052b'; g.fillRect(-20, groundY, W + 40, H - groundY + 20);
  g.strokeStyle = 'rgba(255,79,180,0.55)'; g.lineWidth = 1;
  for (let i = 1; i < 9; i++) {
    const y = groundY + Math.pow(i / 8, 2) * (H - groundY);
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  const sp = 60 * U, o2 = scroll % sp;
  for (let x = -sp * 6 - o2; x < W + sp * 6; x += sp) {
    const vx = W / 2 + (x - W / 2) * 3;
    g.beginPath(); g.moveTo(x, groundY); g.lineTo(vx, H); g.stroke();
  }
  g.shadowColor = '#ff4fb4'; g.shadowBlur = 12;
  g.strokeStyle = '#ff7bd0'; g.lineWidth = 2 * U;
  g.beginPath(); g.moveTo(0, groundY); g.lineTo(W, groundY); g.stroke();

  // coins
  g.shadowColor = '#ffe066'; g.shadowBlur = 12; g.fillStyle = '#ffe066';
  for (const k of coins) {
    const w = Math.abs(Math.cos(time * 4 + k.x * 0.01)) * 8 * U + 2 * U;
    g.beginPath(); g.ellipse(k.x, groundY + k.y, w, 9 * U, 0, 0, Math.PI * 2); g.fill();
  }

  // obstacles
  g.shadowColor = '#ff4fb4'; g.shadowBlur = 16;
  for (const o of obs) {
    const top = groundY - (o.lift || 0) - o.h;
    g.fillStyle = '#2a0b3f'; g.fillRect(o.x, top, o.w, o.h);
    g.strokeStyle = '#ff4fb4'; g.lineWidth = 2.5 * U; g.strokeRect(o.x, top, o.w, o.h);
  }

  // trail + player
  if (state !== 'over') {
    g.shadowBlur = 0;
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i], a = i / trail.length;
      g.fillStyle = `rgba(122,247,255,${a * 0.35})`;
      const s = size() * a * 0.8;
      g.fillRect(t.x - s / 2, t.y - s / 2, s, s);
    }
    const s = size();
    const bob = state === 'menu' ? -Math.abs(Math.sin(time * 4)) * 50 * U : pl.y;
    g.save();
    g.translate(px() + s / 2, groundY + bob - s / 2);
    g.rotate(state === 'menu' ? time * 3 * (bob < -1 ? 1 : 0) : pl.rot);
    g.shadowColor = '#7af7ff'; g.shadowBlur = 20;
    g.fillStyle = '#7af7ff'; g.fillRect(-s / 2, -s / 2, s, s);
    g.shadowBlur = 0; g.fillStyle = '#12052b';
    g.fillRect(-s / 2 + 6 * U, -s / 2 + 6 * U, s - 12 * U, s - 12 * U);
    g.fillStyle = '#7af7ff';
    g.fillRect(-s / 2 + 10 * U, -s / 2 + 10 * U, s - 20 * U, s - 20 * U);
    g.restore();
  }

  g.shadowBlur = 0;
  for (const p of parts) {
    g.globalAlpha = Math.max(0, p.life / p.max); g.fillStyle = p.col;
    g.fillRect(p.x - 2.5 * U, p.y - 2.5 * U, 5 * U, 5 * U);
  }
  g.globalAlpha = 1;
  g.restore();

  // UI
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (state === 'menu') {
    g.shadowColor = '#ff4fb4'; g.shadowBlur = 20;
    text('NEON DASH', W / 2, H * 0.2, 46 * U, '#fff0fb', 900);
    g.shadowBlur = 0;
    if (W < 560) {
      text('Jump the blocks · grab the coins', W / 2, H * 0.2 + 40 * U, 14 * U, 'rgba(243,234,255,0.75)', 500);
      text('Tap twice to double-jump', W / 2, H * 0.2 + 60 * U, 14 * U, 'rgba(243,234,255,0.75)', 500);
    } else text('Jump the blocks · grab the coins · tap twice to double-jump', W / 2, H * 0.2 + 40 * U, 14 * U, 'rgba(243,234,255,0.75)', 500);
    const pulse = 0.6 + 0.4 * Math.sin(time * 4);
    text(TAP + ' to run', W / 2, groundY + (H - groundY) * 0.5, 16 * U, `rgba(243,234,255,${pulse})`, 600);
    if (best) text('Best: ' + best, W / 2, H * 0.2 + (W < 560 ? 88 : 66) * U, 14 * U, '#ffe066', 600);
  } else {
    g.textAlign = 'right';
    text(score(), W - 18, 34 * U, 34 * U, '#ffffff', 800);
    text('◉ ' + coinCount, W - 18, 66 * U, 14 * U, '#ffe066', 700);
    g.textAlign = 'left';
    text('Best ' + best, 16, 22, 13 * U, 'rgba(243,234,255,0.55)', 600);
  }
  if (state === 'over' && deadT > 0.35) {
    g.textAlign = 'center';
    g.fillStyle = 'rgba(18,5,43,0.5)'; g.fillRect(0, 0, W, H);
    g.shadowColor = '#ff4fb4'; g.shadowBlur = 18;
    text('CRASHED', W / 2, H * 0.3, 42 * U, '#ff7bd0', 900);
    g.shadowBlur = 0;
    text('Score ' + score(), W / 2, H * 0.3 + 44 * U, 22 * U, '#ffffff', 700);
    text(newBest ? '★ New best!' : 'Best ' + best, W / 2, H * 0.3 + 74 * U, 16 * U, '#ffe066', 600);
    if (deadT > 0.6) {
      const pulse = 0.6 + 0.4 * Math.sin(time * 4);
      text(TAP + ' to run again', W / 2, H * 0.3 + 116 * U, 16 * U, `rgba(243,234,255,${pulse})`, 600);
    }
  }
  if (muted) { g.textAlign = 'left'; text('muted (M)', 16, 42, 13 * U, 'rgba(243,234,255,0.55)', 600); }
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
